name: personal_life_dashboard
description: A local-first personal dashboard with academic schedules for Windows and Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.7
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: ^22.3.1
  flutter_inappwebview: ^6.1.5
  html: ^0.15.7
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.6
  timezone: ^0.11.1
  uuid: ^4.6.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3
